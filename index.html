<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>フェネック</title>
    <style>html,body{background:#dfe4e8;height:100%;margin:0;font-family:system-ui,sans-serif;overflow:hidden}#app{position:fixed;inset:0}#error{color:#a00;background:#fff3f3;border-radius:8px;padding:12px;position:fixed;top:16px;left:16px;right:16px}#hud{color:#fff;pointer-events:none;white-space:pre;background:#00000073;border-radius:4px;padding:4px 8px;font:12px/1.4 ui-monospace,monospace;position:fixed;top:8px;left:8px}#xr-buttons{flex-wrap:wrap;justify-content:center;gap:12px;width:max-content;max-width:calc(100% - 32px);display:flex;position:fixed;bottom:48px;left:50%;transform:translate(-50%)}#xr-buttons[hidden]{display:none}#xr-buttons button{color:#fff;cursor:pointer;white-space:nowrap;background:#2f6fb0;border:0;border-radius:10px;padding:14px 22px;font-size:18px}#xr-buttons button[data-xr=room-setup],#xr-buttons button[data-xr=ambient]{background:#5d6c7b}#xr-buttons button[data-xr=ambient][aria-pressed=true]{background:#2e8b57}#xr-buttons button[data-xr=ambient][data-state=denied]{background:#b04a3f}#room-setup{box-sizing:border-box;color:#222;background:#fff;border-radius:12px;width:min(420px,100% - 32px);padding:20px;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 8px 32px #00000040}#room-setup h2{margin:0 0 8px;font-size:20px}#room-setup p{margin:0 0 16px;font-size:16px;line-height:1.6}#room-setup .actions{justify-content:flex-end;gap:12px;display:flex}#room-setup button{cursor:pointer;color:#222;background:#e4e8ec;border:0;border-radius:10px;padding:12px 18px;font-size:16px}#room-setup button[data-action=open]{color:#fff;background:#2f6fb0}#help{color:#333;background:#ffffffbf;border-radius:6px;padding:6px 10px;font-size:12px;position:fixed;bottom:8px;left:8px}</style>
    <script type="module" crossorigin src="./assets/index-NAK2GAhI.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" hidden></div>
    <div id="help">床をクリック: 呼ぶ ／ 頭の上をドラッグ: なでる ／ 体をクリック: つつく ／ 右ドラッグ: 回転 ／ ホイール: 拡大縮小</div>

    <div id="error" hidden></div>
